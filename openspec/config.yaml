schema: spec-driven
spec_dir: openspec/specs
context: |
  Tech stack: Python 3.12+, FastAPI, Uvicorn, Jinja2, HTMX, music21, reportlab,
  svglib, mido, pytest, ruff, mypy strict, and uv for package management.

  Product goal: turn imported MusicXML into beginner-friendly ukulele practice
  packs for children and parent-child workshops.

  Project rules: no React/Node/TypeScript, use conventional commits, keep public
  functions typed, and treat PRD.md, MISSION.md, and AGENTS.md as read-only.
rules:
  spec:
    - Keep one capability per spec file under openspec/specs.
    - Include Summary, Contract, Acceptance Signals, Out of Scope, and References.
    - Match current implemented behavior before proposing future expansion.
