[project]
name = "ukepack"
version = "0.1.0"
description = "AI ukulele parent-child practice pack generator"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.5",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlmodel>=0.0.22",
    "music21>=9.3",
    "mido>=1.3",
    "reportlab>=4.2",
    "svglib>=1.5",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".tmp/ruff_cache"
src = ["app", "tests"]
exclude = [
    "tests/fixtures",
    ".venv",
    ".ruff_cache",
    ".pytest_cache",
    ".mypy_cache",
    ".uv",
    ".cache",
    "build",
    "dist",
    "tmp",
    ".codex-tmp",
    ".tmp-run",
    ".tmp-test",
    ".tmp-perm-test",
    "baseline-temp",
]

[tool.ruff.lint]
select = ["E", "F", "N", "UP", "B", "SIM", "RUF"]
# RUF001: project uses Traditional Chinese strings with fullwidth punctuation
ignore = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -n4 --dist=worksteal"
asyncio_mode = "auto"
